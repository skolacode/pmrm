<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PMRM Family Tree Directory</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #f4f1eb;
            --card-bg: #fdfbf7;
            --card-border: #e6e2da;
            --text-main: #2c2a27;
            --text-muted: #6e6a64;
            --glass-bg: rgba(255, 255, 255, 0.2);
            --glass-border: rgba(255, 255, 255, 0.3);
            --shadow: 0 4px 20px 0 rgba(0, 0, 0, 0.08);
            --primary: #4a5d4e;
            --line-color: #bfae99;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            -webkit-text-size-adjust: 100%; 
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 12px;
        }

        /* Viewport Frame for sliding page transitions */
        .app-viewport {
            width: 100%;
            max-width: 1100px;
            position: relative;
            overflow: hidden;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.04);
            border: 4px solid #c9c3b8;
            background: var(--card-bg);
        }

        .app-stage {
            display: flex;
            width: 200%; 
            align-items: flex-start;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .page {
            width: 50%; 
            display: flex;
            flex-direction: column;
            background: var(--card-bg);
        }

        /* ========================================== */
        /* PAGE 1: DIRECTORY PANEL                    */
        /* ========================================== */
        .montage-header {
            position: relative;
            height: 220px;
            background: url('https://images.unsplash.com/photo-1511632765486-a01980e01a18?auto=format&fit=crop&w=800&q=80') center/cover no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px 16px;
            text-align: center;
        }

        .montage-header::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.25);
            z-index: 1;
        }

        .title-card {
            position: relative;
            z-index: 2;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            padding: 12px 20px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            color: #ffffff;
            width: 90%;
        }

        .title-card h1 {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 2px;
        }

        .title-card p { font-size: 0.85rem; line-height: 1.2; }

        .search-container {
            position: relative;
            z-index: 3;
            width: 100%;
            max-width: 90%;
            margin-bottom: -36px; 
        }

        .search-container input {
            width: 100%;
            padding: 14px 16px 14px 44px;
            font-size: 0.95rem;
            border: 1px solid var(--glass-border);
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.06);
            color: var(--text-main);
            outline: none;
        }

        .search-container i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .directory-body {
            padding: 50px 16px 24px 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .controls-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 12px;
        }

        .sort-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            min-width: 0;
        }

        .sort-btn { flex-shrink: 0; }

        .sort-btn {
            background: #ffffff;
            border: 1px solid var(--card-border);
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.85rem;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .names-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 10px;
            max-height: 55vh;
            overflow-y: auto;
        }

        .name-card {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #ffffff;
            border: 1px solid var(--card-border);
            padding: 10px 12px;
            border-radius: 12px;
            cursor: pointer;
        }

        .avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background-color: #ded9d0;
            overflow: hidden;
            flex-shrink: 0;
        }

        .avatar img { width: 100%; height: 100%; object-fit: cover; }

        .name-info {
            font-weight: 500;
            color: var(--text-main);
            font-size: 0.85rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ========================================== */
        /* PAGE 2: UPDATED TOP-DOWN DRAWING TREE UI    */
        /* ========================================== */
        .tree-header {
            display: flex;
            align-items: center;
            padding: 16px;
            border-bottom: 1px solid var(--card-border);
            background: #ffffff;
        }

        .back-btn {
            background: none;
            border: none;
            font-size: 1.1rem;
            color: var(--text-main);
            cursor: pointer;
            padding: 8px;
            margin-right: 8px;
        }

        .tree-header-title h2 { font-size: 1.1rem; color: var(--text-main); }
        .tree-header-title p { font-size: 0.75rem; color: var(--text-muted); }

        /* Tree Diagram Container Map - Allows dynamic swipe panning on mobile viewports */
        .tree-stage {
            position: relative;
        }

        .tree-canvas {
            padding: 30px 16px;
            overflow: auto;
            max-height: calc(100vh - 160px);
            background-color: #faf8f5;
            background-image: radial-gradient(circle, #e9e4da 1px, transparent 1px);
            background-size: 22px 22px;
            display: flex;
            -webkit-overflow-scrolling: touch;
        }

        /* Wrapper that gets scaled by the zoom controls. Using the `zoom`
           property (not transform) so the scroll area reflows correctly. */
        .tree-zoom {
            margin: auto;
            min-width: max-content;
        }

        /* Floating zoom controls */
        .zoom-controls {
            position: absolute;
            right: 16px;
            bottom: 16px;
            display: flex;
            align-items: center;
            gap: 4px;
            background: #ffffff;
            border: 1px solid var(--card-border);
            border-radius: 50px;
            padding: 4px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.1);
            z-index: 5;
        }
        .zoom-btn {
            width: 34px;
            height: 34px;
            border: none;
            border-radius: 50%;
            background: transparent;
            color: var(--text-main);
            cursor: pointer;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s ease;
        }
        .zoom-btn:hover { background: #f1f5f2; color: var(--primary); }
        .zoom-level {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-muted);
            min-width: 42px;
            text-align: center;
            user-select: none;
        }

        /* Inner wrapper centers the tree when it fits and stays
           scrollable from the left edge when it overflows. */
        .tree-inner {
            margin: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: max-content;
        }

        /* Generational Hierarchy Layout Block */
        .generation-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: max-content;
        }

        /* STRUCTURE FOR L1 COUPLES (Horizontal Side-by-Side) */
        .couple-unit-horizontal {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            position: relative;
        }

        /* STRUCTURE FOR L2+ COUPLES (Vertical Stacked Stack) */
        .couple-unit-vertical {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* Universal Spouse '+' Operator Label style settings */
        .spouse-plus {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--line-color);
            user-select: none;
            line-height: 1;
        }
        .couple-unit-horizontal .spouse-plus { padding: 0 4px; }
        .couple-unit-vertical .spouse-plus { margin: 2px 0; }

        /* Refined Structural Pillow Oval Pill Node Box */
        .node-box {
            background: #ffffff;
            border: 1.5px solid var(--card-border);
            border-radius: 30px; 
            padding: 8px 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
            min-width: 130px;
            max-width: 155px;
        }

        .node-box.highlight {
            border-color: var(--primary);
            background-color: #f1f5f2;
            box-shadow: 0 4px 10px rgba(74, 93, 78, 0.15);
        }

        /* Brief attention pulse on the person you opened the tree for. */
        @keyframes nodePulse {
            0%   { box-shadow: 0 0 0 0 rgba(74, 93, 78, 0.45); }
            70%  { box-shadow: 0 0 0 12px rgba(74, 93, 78, 0); }
            100% { box-shadow: 0 0 0 0 rgba(74, 93, 78, 0); }
        }
        .node-box.pulse { animation: nodePulse 1.1s ease-out 2; }

        .node-box .node-txt {
            flex: 1;
            min-width: 0;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Cross-family marriage link button (shown on married-in spouses) */
        .link-btn {
            flex-shrink: 0;
            width: 20px;
            height: 20px;
            border: none;
            border-radius: 50%;
            background: var(--primary);
            color: #ffffff;
            font-size: 0.62rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s ease, background 0.15s ease;
        }
        .link-btn:hover { background: #3a4a3e; transform: scale(1.12); }

        /* Perfect Vertical Line Connectors ('|') */
        .v-line {
            width: 2px;
            height: 26px;
            background-color: var(--line-color);
            margin: 0;
            position: relative;
        }

        /* SIBLING TRACK SYSTEM (Horizontal layout branch track line rules) */
        .children-row {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            position: relative;
        }

        .child-branch {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            /* Top space holds the connector lines; the side padding lets each
               child's horizontal bar meet its neighbour with no gaps. */
            padding: 22px 16px 0;
        }

        /* Vertical drop from the horizontal sibling bar down to each child. */
        .child-branch::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 22px;
            background-color: var(--line-color);
        }

        /* Horizontal sibling bar. Each child paints a full-width segment;
           adjacent segments touch (thanks to the side padding) forming one
           continuous line. The ends are trimmed to the outer children. */
        .child-branch::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: var(--line-color);
        }
        .child-branch:first-child::after { left: 50%; width: 50%; }
        .child-branch:last-child::after  { width: 50%; }
        /* A lone child needs no horizontal bar — just the vertical drop. */
        .child-branch:only-child::after { display: none; }

        /* Mobile Scaling Media Queries overrides */
        @media (max-width: 480px) {
            body { padding: 6px; align-items: stretch; }
            .app-viewport { border-radius: 14px; border-width: 3px; }

            .montage-header { height: 180px; padding: 16px 12px; }
            .title-card { padding: 10px 16px; width: 100%; }
            .title-card h1 { font-size: 1.5rem; }
            .title-card p { font-size: 0.75rem; }
            .search-container { max-width: 100%; }
            .search-container input { padding: 12px 14px 12px 40px; font-size: 0.9rem; }

            .directory-body { padding: 46px 12px 20px 12px; gap: 12px; }
            .sort-label { font-size: 0.78rem; }
            .names-grid {
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
                gap: 8px;
                max-height: 60vh;
            }
            .name-card { padding: 9px 10px; }

            .tree-header { padding: 12px; }
            .tree-header-title h2 { font-size: 1rem; }
            .tree-canvas { padding: 24px 12px; max-height: calc(100vh - 130px); }
            .node-box { min-width: 110px; max-width: 140px; padding: 7px 10px; }
            .node-box .node-txt { font-size: 0.75rem; }
            .child-branch { padding-left: 8px; padding-right: 8px; }
        }

        /* Desktop Scaling Media Queries overrides */
        @media (min-width: 768px) {
            body { padding: 40px; }
            .app-viewport { border-radius: 28px; border-width: 8px; }
            .montage-header { height: 320px; padding: 30px; }
            .title-card { padding: 15px 40px; border-radius: 16px; width: auto; }
            .title-card h1 { font-size: 2.5rem; }
            .title-card p { font-size: 1rem; }
            .search-container { max-width: 500px; margin-bottom: -25px; }
            .search-container input { padding: 16px 24px 16px 50px; font-size: 1rem; }
            .directory-body { padding: 50px 40px 40px 40px; gap: 20px; }
            .names-grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
            .name-card { padding: 12px 16px; gap: 12px; }
            .avatar { width: 32px; height: 32px; }
            .name-info { font-size: 0.95rem; }
            
            .tree-header { padding: 24px 40px; }
            .node-box { min-width: 155px; padding: 10px 20px; }
            .node-box .node-txt { font-size: 0.88rem; }
            .child-branch { padding-left: 22px; padding-right: 22px; }
        }
    </style>
</head>
<body>

    <div class="app-viewport">
        <div class="app-stage" id="appStage">
            
            <section class="page">
                <header class="montage-header">
                    <div class="title-card">
                        <h1>PMRM</h1>
                        <p>Pertubuhan Muslim Regunathapuram Malaysia</p>
                    </div>
                    <div class="search-container">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="text" id="searchInput" placeholder="Search for family members...">
                    </div>
                </header>

                <main class="directory-body">
                    <div class="controls-panel">
                        <div class="sort-label">
                            <i class="fa-solid fa-arrow-down-a-z"></i> 
                            <span>List of names sorted by A~Z</span>
                        </div>
                        <button class="sort-btn" id="sortToggle" data-order="asc">
                            Sort <i class="fa-solid fa-sort-up"></i>
                        </button>
                    </div>
                    <div class="names-grid" id="namesGrid"></div>
                </main>
            </section>

            <section class="page">
                <header class="tree-header">
                    <button class="back-btn" id="backToDirectory">
                        <i class="fa-solid fa-arrow-left"></i>
                    </button>
                    <div class="tree-header-title">
                        <h2 id="treeTargetName">Lineage View</h2>
                        <p>PMRM Generation Tree Map</p>
                    </div>
                </header>

                <div class="tree-stage">
                    <main class="tree-canvas" id="treeCanvas">
                        </main>

                    <div class="zoom-controls">
                        <button class="zoom-btn" id="zoomOut" title="Zoom out"><i class="fa-solid fa-minus"></i></button>
                        <span class="zoom-level" id="zoomLevel">100%</span>
                        <button class="zoom-btn" id="zoomIn" title="Zoom in"><i class="fa-solid fa-plus"></i></button>
                        <button class="zoom-btn" id="zoomReset" title="Reset / fit"><i class="fa-solid fa-expand"></i></button>
                    </div>
                </div>
            </section>

        </div>
    </div>

    <script>
        const m = n => `https://randomuser.me/api/portraits/thumb/men/${n}.jpg`;
        const w = n => `https://randomuser.me/api/portraits/thumb/women/${n}.jpg`;

        /* ============================================================
           FIRESTORE-SHAPED SAMPLE DATA  (collection: "people")
           --------------------------------------------------------
           Each entry mirrors one Firestore document. The tree is NOT
           stored nested in the DB — instead every person references:
             - parentId : the bloodline parent's id (null for a root
                          person and for married-in spouses)
             - spouseId : the partner's id (null if unmarried)
             - rootId   : which family tree this person belongs to
           The nested tree is rebuilt in the browser by buildTreesFromFlat().
           ============================================================ */
        const peopleData = [
            /* ===========================================================
               TREE A — root "Seeni Mohammad (Kambukarar)"   (rootId "s1")
               Generations: Seeni Mohammad > Mohd Kassim / Rokaiya Ammal /
               Aminah Ammal, then deeper through A. Abbas > Habib Mohammad
               and Sultan > Abu Ayubul Ansari.
               =========================================================== */
            { id: "s1",  name: "Seeni Mohammad (Kambukarar)", gender: "male",   avatar: m(1),  parentId: null, spouseId: null,  rootId: "s1" },

            /* Gen 1 — children of Seeni Mohammad */
            { id: "s3",  name: "Mohd Kassim",        gender: "male",   avatar: m(2),  parentId: "s1", spouseId: "s6",  rootId: "s1" },
            { id: "s4",  name: "Rokaiya Ammal",      gender: "female", avatar: w(1),  parentId: "s1", spouseId: "s25", rootId: "s1" },
            { id: "s5",  name: "Aminah Ammal",       gender: "female", avatar: w(2),  parentId: "s1", spouseId: null,  rootId: "s1" },

            /* Mohd Kassim + Sabiya Ammal */
            { id: "s6",  name: "Sabiya Ammal",       gender: "female", avatar: w(3),  parentId: null, spouseId: "s3",  rootId: "s1" },
            { id: "s7",  name: "Sooriyath",          gender: "female", avatar: w(4),  parentId: "s3", spouseId: null,  rootId: "s1" },
            { id: "s8",  name: "Saurab",             gender: "female", avatar: w(5),  parentId: "s3", spouseId: null,  rootId: "s1" },
            { id: "s9",  name: "A. Abbas",           gender: "male",   avatar: m(3),  parentId: "s3", spouseId: "s12", rootId: "s1" },
            { id: "s10", name: "Seeni",              gender: "male",   avatar: m(4),  parentId: "s3", spouseId: null,  rootId: "s1" },
            { id: "s11", name: "Kader Moideen",      gender: "male",   avatar: m(5),  parentId: "s3", spouseId: null,  rootId: "s1" },

            /* A. Abbas + Ibrahiyammal */
            { id: "s12", name: "Ibrahiyammal",       gender: "female", avatar: w(6),  parentId: null, spouseId: "s9",  rootId: "s1" },
            { id: "s13", name: "Habib Mohammad",     gender: "male",   avatar: m(6),  parentId: "s9", spouseId: "s19", rootId: "s1" },
            { id: "s14", name: "Haja Najimudeen",    gender: "male",   avatar: m(7),  parentId: "s9", spouseId: null,  rootId: "s1" },
            { id: "s15", name: "Barakatullah Khan",  gender: "male",   avatar: m(8),  parentId: "s9", spouseId: null,  rootId: "s1" },
            { id: "s16", name: "Jahira Banu",        gender: "female", avatar: w(7),  parentId: "s9", spouseId: null,  rootId: "s1" },
            { id: "s17", name: "Mohammad Sirajuddin",gender: "male",   avatar: m(9),  parentId: "s9", spouseId: null,  rootId: "s1" },
            { id: "s18", name: "Bazeela",            gender: "female", avatar: w(8),  parentId: "s9", spouseId: null,  rootId: "s1" },

            /* Habib Mohammad + Nooriya Banu */
            { id: "s19", name: "Nooriya Banu",       gender: "female", avatar: w(9),  parentId: null,  spouseId: "s13", rootId: "s1" },
            { id: "s20", name: "Mohamed Azli",       gender: "male",   avatar: m(10), parentId: "s13", spouseId: null,  rootId: "s1" },
            { id: "s21", name: "Azia",               gender: "female", avatar: w(10), parentId: "s13", spouseId: null,  rootId: "s1" },
            { id: "s22", name: "Mohd Azurul",        gender: "male",   avatar: m(11), parentId: "s13", spouseId: null,  rootId: "s1" },
            { id: "s23", name: "Azura",              gender: "female", avatar: w(11), parentId: "s13", spouseId: null,  rootId: "s1" },
            { id: "s24", name: "Azreena",            gender: "female", avatar: w(12), parentId: "s13", spouseId: null,  rootId: "s1" },

            /* Rokaiya Ammal + Abdul Hameed (kaandakarar son) */
            { id: "s25", name: "Abdul Hameed",       gender: "male",   avatar: m(12), parentId: null, spouseId: "s4",  rootId: "s1" },
            { id: "s26", name: "Salma",              gender: "female", avatar: w(13), parentId: "s4", spouseId: null,  rootId: "s1" },
            { id: "s27", name: "Senni Kader",        gender: "male",   avatar: m(13), parentId: "s4", spouseId: null,  rootId: "s1" },
            { id: "s28", name: "Kasura",             gender: "female", avatar: w(14), parentId: "s4", spouseId: null,  rootId: "s1" },
            { id: "s29", name: "Sultan",             gender: "male",   avatar: m(14), parentId: "s4", spouseId: "s33", rootId: "s1" },
            { id: "s30", name: "Saburan Jamila",     gender: "female", avatar: w(15), parentId: "s4", spouseId: null,  rootId: "s1" },
            { id: "s31", name: "Mehar",              gender: "female", avatar: w(16), parentId: "s4", spouseId: null,  rootId: "s1" },
            { id: "s32", name: "Olina",              gender: "female", avatar: w(17), parentId: "s4", spouseId: null,  rootId: "s1" },

            /* Sultan + Pathaisha */

        /* ============================================================
           FIREBASE / FIRESTORE INTEGRATION
           --------------------------------------------------------
           1. Create a Firebase project + Firestore database.
           2. Paste your web app config below and set USE_FIREBASE = true.
           3. Seed a "people" collection with documents shaped exactly
              like the objects in peopleData above (the doc id should
              match the "id" field, or just remove "id" and use the
              auto doc id consistently in parentId/spouseId/rootId).
           When USE_FIREBASE is false (or loading fails), the app falls
           back to the local peopleData sample so it still works offline.
           ============================================================ */
        const USE_FIREBASE = false;
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        async function loadPeople() {
            if (!USE_FIREBASE) return peopleData;
            try {
                const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
                const { getFirestore, collection, getDocs } =
                    await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');
                const app = initializeApp(firebaseConfig);
                const db = getFirestore(app);
                const snap = await getDocs(collection(db, 'people'));
                const docs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                return docs.length ? docs : peopleData;
            } catch (err) {
                console.warn('Firestore load failed — using local sample data.', err);
                return peopleData;
            }
        }

        // Rebuild nested family trees from the flat (Firestore-shaped) list.
        function buildTreesFromFlat(people) {
            const byId = {};
            people.forEach(p => { byId[p.id] = Object.assign({}, p, { children: [] }); });
            people.forEach(p => {
                const node = byId[p.id];
                if (p.spouseId && byId[p.spouseId]) node.spouse = byId[p.spouseId];
                if (p.parentId && byId[p.parentId]) byId[p.parentId].children.push(node);
            });
            return byId;
        }

        let familyData = [];
        let peopleById = {};

        const appStage = document.getElementById('appStage');
        const namesGrid = document.getElementById('namesGrid');
        const searchInput = document.getElementById('searchInput');
        const sortToggle = document.getElementById('sortToggle');
        const backBtn = document.getElementById('backToDirectory');
        const treeTargetName = document.getElementById('treeTargetName');
        const treeCanvas = document.getElementById('treeCanvas');
        const zoomInBtn = document.getElementById('zoomIn');
        const zoomOutBtn = document.getElementById('zoomOut');
        const zoomResetBtn = document.getElementById('zoomReset');
        const zoomLevelEl = document.getElementById('zoomLevel');

        function renderGrid(data) {
            namesGrid.innerHTML = '';
            data.forEach(person => {
                const card = document.createElement('div');
                card.className = 'name-card';
                card.innerHTML = `
                    <div class="name-info">${person.name}</div>
                `;
                card.addEventListener('click', () => buildWireframeTreeMap(person.id));
                namesGrid.appendChild(card);
            });
        }

        function createPillNode(person, focusId, linkable) {
            const isFocus = person.id === focusId;
            const linkBtn = linkable
                ? `<button class="link-btn" data-link="${person.id}" title="Open ${person.name}'s family">
                       <i class="fa-solid fa-link"></i>
                   </button>`
                : '';
            return `
                <div class="node-box ${isFocus ? 'highlight' : ''}">
                    <span class="node-txt">${person.name}</span>
                    ${linkBtn}
                </div>
            `;
        }

        function renderCouple(node, isTop, focusId) {
            const cls = isTop ? 'couple-unit-horizontal' : 'couple-unit-vertical';
            let html = `<div class="${cls}">`;
            // The bloodline person of THIS tree — never linkable here.
            html += createPillNode(node, focusId, false);
            if (node.spouse) {
                html += `<div class="spouse-plus">+</div>`;
                // A married-in spouse who is a blood child of another family
                // gets a link button that jumps to that family (which links
                // back here automatically).
                const linkable = !!node.spouse.parentId;
                html += createPillNode(node.spouse, focusId, linkable);
            }
            html += `</div>`;
            return html;
        }

        // Recursively render a person/couple and any descendants.
        function renderBranch(node, isTop, focusId) {
            let html = renderCouple(node, isTop, focusId);
            // Children belong to the couple. They are stored under whichever
            // partner is the bloodline owner, so merge both partners' kids so
            // the family shows up no matter which spouse we entered through.
            const kids = [
                ...(node.children || []),
                ...((node.spouse && node.spouse.children) || [])
            ];
            if (kids.length) {
                html += `<div class="v-line"></div>`;
                html += `<div class="children-row">`;
                kids.forEach(child => {
                    html += `<div class="child-branch">${renderBranch(child, false, focusId)}</div>`;
                });
                html += `</div>`;
            }
            return html;
        }

        function buildWireframeTreeMap(personId) {
            const person = peopleById[personId];
            if (!person) return;
            const root = peopleById[person.rootId] || person;

            treeTargetName.textContent = `${person.name}'s Lineage`;
            treeCanvas.innerHTML = '';

            // Zoom wrapper -> inner -> generation block.
            const zoomWrap = document.createElement('div');
            zoomWrap.className = 'tree-zoom';
            zoomWrap.id = 'treeZoom';

            const treeInner = document.createElement('div');
            treeInner.className = 'tree-inner';

            const block = document.createElement('div');
            block.className = 'generation-block';
            block.innerHTML = renderBranch(root, true, person.id);
            treeInner.appendChild(block);
            zoomWrap.appendChild(treeInner);

            treeCanvas.appendChild(zoomWrap);

            // Slide viewport forward smoothly
            appStage.style.transform = 'translateX(-50%)';
            treeCanvas.scrollLeft = 0;
            // Start zoomed in on the selected person & their immediate family,
            // then let the user zoom out to see the wider tree.
            focusSelected();
        }

        /* ---------------- Zoom controls ---------------- */
        const MIN_ZOOM = 0.4, MAX_ZOOM = 2;
        const FOCUS_ZOOM = 1; // readable level when first opening a person
        let zoom = 1;

        function applyZoom() {
            const wrap = document.getElementById('treeZoom');
            if (wrap) wrap.style.zoom = zoom;
            zoomLevelEl.textContent = Math.round(zoom * 100) + '%';
        }

        function setZoom(z) {
            zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, z));
            applyZoom();
        }

        // Center the currently highlighted person within the canvas viewport.
        function centerHighlighted() {
            const node = treeCanvas.querySelector('.node-box.highlight');
            if (!node) return;
            const canvasRect = treeCanvas.getBoundingClientRect();
            const nodeRect = node.getBoundingClientRect();
            treeCanvas.scrollLeft += (nodeRect.left + nodeRect.width / 2) - (canvasRect.left + canvasRect.width / 2);
            treeCanvas.scrollTop  += (nodeRect.top + nodeRect.height / 2) - (canvasRect.top + canvasRect.height / 3);
        }

        // Open zoomed in on the selected person, centered, with a brief pulse.
        function focusSelected() {
            setZoom(FOCUS_ZOOM);
            // Wait for layout/zoom to settle before measuring positions.
            requestAnimationFrame(() => {
                centerHighlighted();
                const node = treeCanvas.querySelector('.node-box.highlight');
                if (node) {
                    node.classList.remove('pulse');
                    // reflow so the animation can replay on every open
                    void node.offsetWidth;
                    node.classList.add('pulse');
                }
            });
        }

        // Auto-fit the whole tree to the available canvas width (zoom out).
        function fitZoom() {
            const wrap = document.getElementById('treeZoom');
            if (!wrap) return;
            wrap.style.zoom = 1;
            const available = treeCanvas.clientWidth - 32; // minus padding
            const needed = wrap.scrollWidth;
            if (needed > available) {
                setZoom(Math.max(MIN_ZOOM, available / needed));
            } else {
                zoom = 1;
                applyZoom();
            }
        }

        zoomInBtn.addEventListener('click', () => setZoom(zoom + 0.1));
        zoomOutBtn.addEventListener('click', () => setZoom(zoom - 0.1));
        zoomResetBtn.addEventListener('click', fitZoom);

        // Ctrl/⌘ + wheel to zoom over the canvas.
        treeCanvas.addEventListener('wheel', (e) => {
            if (!(e.ctrlKey || e.metaKey)) return;
            e.preventDefault();
            setZoom(zoom + (e.deltaY < 0 ? 0.08 : -0.08));
        }, { passive: false });

        // Clicking a link button on a married-in spouse opens their family
        // tree, focused on that spouse.
        treeCanvas.addEventListener('click', (e) => {
            const btn = e.target.closest('.link-btn');
            if (!btn) return;
            buildWireframeTreeMap(btn.dataset.link);
        });

        backBtn.addEventListener('click', () => { appStage.style.transform = 'translateX(0%)'; });

        function processData() {
            const query = searchInput.value.toLowerCase().trim();
            const order = sortToggle.getAttribute('data-order');
            let filtered = familyData.filter(person => person.name.toLowerCase().includes(query));
            filtered.sort((a, b) => order === 'asc' ? a.name.localeCompare(b.name) : b.name.localeCompare(a.name));
            renderGrid(filtered);
        }

        searchInput.addEventListener('input', processData);
        sortToggle.addEventListener('click', () => {
            const currentOrder = sortToggle.getAttribute('data-order');
            sortToggle.setAttribute('data-order', currentOrder === 'asc' ? 'desc' : 'asc');
            sortToggle.innerHTML = `Sort <i class="fa-solid ${currentOrder === 'asc' ? 'fa-sort-down' : 'fa-sort-up'}"></i>`;
            processData();
        });

        // Load people (Firestore or local sample), rebuild trees, render directory.
        async function init() {
            const people = await loadPeople();
            peopleById = buildTreesFromFlat(people);
            familyData = people.map(p => ({
                id: p.id,
                name: p.name,
                avatar: p.avatar
            }));
            processData();
        }

        init();
    </script>
